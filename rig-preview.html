<body><main><div id="viewport" aria-label="可拖动旋转的三维人物预览"></div><aside><h1>上半身骨骼试验版</h1><p>已恢复原模型的眼睛和眼皮，关闭独立眼球跟随。保留转头与基础抬臂摆腕试验；袖子有所简化，手指保持原姿势。</p><div id="status" role="status">加载模型…</div><label>测试动画<select id="clip"><option value="">静止姿态</option></select></label><label>手动转头<input id="head" type="range" min="-12" max="12" value="0" aria-label="转头角度"></label><label><input id="skeleton" type="checkbox"> 显示骨骼</label><button id="front">正面视角</button><button id="side">侧前方视角</button><p>鼠标拖动旋转，滚轮缩放。选择 Wave_Test 查看基础摆腕。眼球重建因不够自然而退出默认预览，原眼部外观已保留。</p><a href="/models/scholar-upperbody-rig.glb" download>下载绑定后的 GLB</a><p><a href="/">返回主页</a></p></aside></main><script type="module" src="/scripts/rig-preview.js"></script></body></html>
